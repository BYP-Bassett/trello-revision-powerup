<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Revision Power-Up</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script>
      TrelloPowerUp.initialize({
        "card-buttons": function () {
          return [
            {
              icon: "https://cdn-icons-png.flaticon.com/512/992/992700.png",
              text: "Add Revision Checklist",
              callback: function (t) {
                return t.popup({
                  title: "Revision Power-Up",
                  url: "client.html",
                  height: 150
                });
              }
            }
          ];
        }
      });
    </script>
  </head>
  <body>
    <p>Revision Power-Up ready.</p>
  </body>
</html>
